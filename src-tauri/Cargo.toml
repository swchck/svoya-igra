[package]
name = "svoya-igra"
version = "0.2.0"
description = "Конструктор и проигрыватель «Своей игры»"
edition = "2024"
rust-version = "1.90"

[lib]
name = "svoya_igra_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2"
tiny_http = "0.12"
getrandom = "0.3"
local-ip-address = "0.6"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
