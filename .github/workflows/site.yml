name: Site

# The promo site on GitHub Pages, with the web build of the app under /app/. The site
# reads the latest release at runtime, so a new release does not need a redeploy.
on:
  push:
    branches: [master]
    paths:
      - 'site/**'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'assets/**'
      - 'package-lock.json'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # a deploy cut off halfway leaves Pages on the old build, so queue instead
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run site:build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist
      - uses: actions/deploy-pages@v5
        id: deployment
