name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Build standard
        run: npm run build
      - name: Build portable
        run: npm run build:portable
      - name: Package artifacts
        run: |
          cp dist-portable/index.html svoya-igra-portable.html
          zip -r svoya-igra-dist.zip dist/
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "${{ github.ref_name }}" --yes 2>/dev/null || true
          gh release create "${{ github.ref_name }}" \
            --title "Своя игра ${{ github.ref_name }}" \
            --generate-notes \
            svoya-igra-portable.html \
            svoya-igra-dist.zip
