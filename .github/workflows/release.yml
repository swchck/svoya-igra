name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - label: macOS-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - label: macOS-x64
            os: macos-latest
            target: x86_64-apple-darwin
          - label: Windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - label: Linux-x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.target }}
      - run: npm ci
      - name: Build installers
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # with CI=true the bundler skips the Finder pass that lays out the DMG window,
          # which ships a plain window with no background (tauri-apps/tauri#592)
          TAURI_BUNDLER_DMG_IGNORE_CI: 'true'
        run: |
          version="${GITHUB_REF_NAME#v}"
          # update bundles need the signing key; without it the release ships installers only
          updater=false
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then updater=true; fi
          npx tauri build --target ${{ matrix.target }} \
            --config "{\"version\":\"$version\",\"bundle\":{\"createUpdaterArtifacts\":$updater}}"
      - name: Collect installers
        run: node scripts/release-assets.mjs ${{ matrix.target }} ${{ matrix.label }} out
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.label }}
          path: out/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          # not assets/: the checkout already has one, with the app icon in it
          path: release
          merge-multiple: true
      - name: Updater manifest
        run: |
          node scripts/updater-manifest.mjs release "${GITHUB_REF_NAME#v}" "$GITHUB_REF_NAME" > latest.json
          if [ -s latest.json ]; then mv latest.json release/; else rm latest.json; fi
          ls -la release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$GITHUB_REF_NAME" --yes 2>/dev/null || true
          # v1.0.0-rc1 and the like must not become releases/latest, which feeds the updater
          prerelease=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" \
            --title "Своя Игра ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            "${prerelease[@]}" \
            release/*
